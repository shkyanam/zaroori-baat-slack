<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Zaroori Baat Slack architecture</title>
  <desc id="diagram-description">Slack events, bounded history, and mock messages enter a Python HTTP service, run through a durable LangGraph workflow with parallel action and decision memory extraction, and are persisted for human review, optional AI and memory integrations, and observability.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173f53"/>
      <stop offset="1" stop-color="#176b62"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f7f3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#183c3b" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#3d7180"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8aa9a3"/>
    </marker>
    <style>
      .title{font:700 42px Georgia,serif;fill:#173f53}
      .subtitle{font:400 20px Arial,sans-serif;fill:#55716f}
      .section{font:700 20px Arial,sans-serif;fill:#fff}
      .header-meta{font:400 12px Arial,sans-serif;fill:#d8efea}
      .paneltitle{font:700 18px Arial,sans-serif;fill:#173f53}
      .node-title{font:700 15px Arial,sans-serif;fill:#173f53}
      .body{font:400 14px Arial,sans-serif;fill:#284744}
      .small{font:400 12px Arial,sans-serif;fill:#55716f}
      .tiny{font:400 11px Arial,sans-serif;fill:#55716f}
      .bold{font:700 14px Arial,sans-serif;fill:#173f53}
      .center{font:700 16px Arial,sans-serif;fill:#173f53;text-anchor:middle}
      .center-small{font:400 12px Arial,sans-serif;fill:#55716f;text-anchor:middle}
      .number{font:700 14px Arial,sans-serif;fill:#fff}
      .box{stroke:#b7d2c8;stroke-width:2;fill:url(#paper)}
      .source{stroke:#83b5c0;stroke-width:2;fill:#eff8fa}
      .agent{stroke:#9b8cce;stroke-width:2;fill:#f6f3ff}
      .store{stroke:#8bb99a;stroke-width:2;fill:#eff9f1}
      .human{stroke:#e59563;stroke-width:2;fill:#fff5ed}
      .integration{stroke:#d3a65f;stroke-width:2;fill:#fff9e8}
      .service{stroke:#5b9f9a;stroke-width:2;fill:#eef9f7}
      .line{stroke:#3d7180;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dashed{stroke:#8aa9a3;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow-dashed)}
      .boundary{fill:#fff;stroke:#274c59;stroke-width:3}
      .lane{fill:#f9fcfb;stroke:#c2d8ce;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1600" height="1320" fill="#fff"/>
  <text x="800" y="50" class="title" text-anchor="middle">Zaroori Baat Slack</text>
  <text x="800" y="82" class="subtitle" text-anchor="middle">Slack event → durable LangGraph workflow → human decision → observable memory</text>

  <!-- Left: inbound systems and guardrails -->
  <rect x="28" y="125" width="245" height="430" rx="12" class="box" filter="url(#shadow)"/>
  <text x="53" y="162" class="paneltitle">Inbound sources</text>
  <rect x="50" y="185" width="201" height="92" rx="10" class="source"/>
  <text x="150" y="216" class="center">Slack workspace</text>
  <text x="150" y="241" class="center-small">Events API · new messages</text>
  <text x="150" y="260" class="center-small">Configured target channels</text>
  <rect x="50" y="295" width="201" height="92" rx="10" class="source"/>
  <text x="150" y="326" class="center">Slack Web API</text>
  <text x="150" y="351" class="center-small">Bounded history scan</text>
  <text x="150" y="370" class="center-small">conversations.history</text>
  <rect x="50" y="405" width="201" height="92" rx="10" class="source"/>
  <text x="150" y="436" class="center">Mock / local input</text>
  <text x="150" y="461" class="center-small">POST /api/messages</text>
  <text x="150" y="480" class="center-small">Demo without Slack credentials</text>

  <rect x="28" y="580" width="245" height="300" rx="12" class="box" filter="url(#shadow)"/>
  <text x="53" y="617" class="paneltitle">Trust boundary</text>
  <text x="53" y="659" class="body">• HMAC signature validation</text>
  <text x="53" y="693" class="body">• URL verification</text>
  <text x="53" y="727" class="body">• Event and subtype filtering</text>
  <text x="53" y="761" class="body">• External-ID deduplication</text>
  <text x="53" y="795" class="body">• Secrets loaded from .env</text>
  <text x="53" y="841" class="small">No Slack UI scraping or</text>
  <text x="53" y="861" class="small">unsupervised outbound replies.</text>

  <!-- Main service boundary -->
  <rect x="295" y="125" width="1015" height="1015" rx="15" class="boundary" filter="url(#shadow)"/>
  <path d="M295 125 H1310 V177 H295 Z" fill="url(#navy)"/>
  <text x="325" y="158" class="section">Python HTTP service</text>
  <text x="1265" y="158" class="header-meta" text-anchor="end">ThreadingHTTPServer · serves UI + JSON API</text>

  <!-- API and ingestion layer -->
  <text x="325" y="209" class="paneltitle">1 · Receive, validate, and normalize</text>
  <rect x="325" y="230" width="296" height="105" rx="10" class="service"/>
  <text x="473" y="261" class="center">Slack webhook</text>
  <text x="473" y="286" class="center-small">POST /webhooks/slack</text>
  <text x="473" y="305" class="center-small">verify → filter → acknowledge</text>
  <text x="473" y="324" class="center-small">event_callback / app_mention</text>
  <rect x="647" y="230" width="296" height="105" rx="10" class="service"/>
  <text x="795" y="261" class="center">History sync endpoint</text>
  <text x="795" y="286" class="center-small">POST /api/slack/sync</text>
  <text x="795" y="305" class="center-small">Slack channel IDs → 50 messages</text>
  <text x="795" y="324" class="center-small">create_message per record</text>
  <rect x="969" y="230" width="296" height="105" rx="10" class="service"/>
  <text x="1117" y="261" class="center">Demo API</text>
  <text x="1117" y="286" class="center-small">POST /api/messages</text>
  <text x="1117" y="305" class="center-small">mock message fallback</text>
  <text x="1117" y="324" class="center-small">same workflow as Slack input</text>
  <path d="M251 231 H325" class="line"/>
  <path d="M251 341 H647" class="line"/>
  <path d="M251 451 H969" class="line"/>

  <rect x="425" y="365" width="755" height="64" rx="10" class="agent"/>
  <circle cx="456" cy="397" r="16" fill="#7563bd"/>
  <text x="456" y="402" class="number" text-anchor="middle">A</text>
  <text x="485" y="392" class="bold">Normalize + idempotent ingest</text>
  <text x="485" y="413" class="small">message_id · external_id · channel · thread_ts · sender · text · created_at</text>
  <path d="M473 335 V350 H600 V365" class="line"/>
  <path d="M795 335 V365" class="line"/>
  <path d="M1117 335 V350 H1000 V365" class="line"/>

  <!-- LangGraph workflow -->
  <rect x="325" y="460" width="955" height="372" rx="13" class="lane"/>
  <path d="M325 460 H1280 V500 H325 Z" fill="#eef6f3"/>
  <text x="350" y="486" class="paneltitle">2 · LangGraph StateGraph</text>
  <text x="1250" y="486" class="small" text-anchor="end">durable thread_id per workflow run</text>
  <path d="M802 429 V460" class="line"/>

  <rect x="350" y="530" width="194" height="82" rx="10" class="agent"/>
  <circle cx="376" cy="558" r="15" fill="#7563bd"/>
  <text x="376" y="563" class="number" text-anchor="middle">1</text>
  <text x="447" y="557" class="node-title" text-anchor="middle">Classify + prioritize</text>
  <text x="447" y="580" class="small" text-anchor="middle">category · score · priority</text>
  <text x="447" y="598" class="tiny" text-anchor="middle">FYI → Decision Needed</text>

  <rect x="570" y="530" width="205" height="82" rx="10" class="agent"/>
  <circle cx="596" cy="558" r="15" fill="#7563bd"/>
  <text x="596" y="563" class="number" text-anchor="middle">2</text>
  <text x="672" y="557" class="node-title" text-anchor="middle">Find related messages</text>
  <text x="672" y="580" class="small" text-anchor="middle">SQLite history retrieval</text>
  <text x="672" y="598" class="tiny" text-anchor="middle">thread · topic · references</text>

  <rect x="800" y="530" width="220" height="82" rx="10" class="agent"/>
  <circle cx="826" cy="558" r="15" fill="#7563bd"/>
  <text x="826" y="563" class="number" text-anchor="middle">3</text>
  <text x="910" y="557" class="node-title" text-anchor="middle">Context enrichment</text>
  <text x="910" y="580" class="small" text-anchor="middle">mock systems + related Slack</text>
  <text x="910" y="598" class="tiny" text-anchor="middle">optional Nebius synthesis</text>

  <rect x="545" y="690" width="220" height="82" rx="10" class="agent"/>
  <circle cx="571" cy="718" r="15" fill="#7563bd"/>
  <text x="571" y="723" class="number" text-anchor="middle">4</text>
  <text x="655" y="717" class="node-title" text-anchor="middle">Action extraction</text>
  <text x="655" y="740" class="small" text-anchor="middle">tasks · follow-ups · risks</text>
  <text x="655" y="758" class="tiny" text-anchor="middle">owner / due / source IDs</text>

  <rect x="790" y="690" width="220" height="82" rx="10" class="agent"/>
  <circle cx="816" cy="718" r="15" fill="#7563bd"/>
  <text x="816" y="723" class="number" text-anchor="middle">5</text>
  <text x="900" y="717" class="node-title" text-anchor="middle">Decision memory</text>
  <text x="900" y="740" class="small" text-anchor="middle">chosen option · alternatives</text>
  <text x="900" y="758" class="tiny" text-anchor="middle">participants · rationale · confidence</text>

  <rect x="1035" y="690" width="220" height="82" rx="10" class="store"/>
  <circle cx="1061" cy="718" r="15" fill="#4c9b6d"/>
  <text x="1061" y="723" class="number" text-anchor="middle">6</text>
  <text x="1145" y="717" class="node-title" text-anchor="middle">Persist output</text>
  <text x="1145" y="740" class="small" text-anchor="middle">messages + JSON fields</text>
  <text x="1145" y="758" class="tiny" text-anchor="middle">preserve stored memory marker</text>

  <path d="M544 571 H570" class="line"/>
  <path d="M775 571 H800" class="line"/>
  <path d="M910 612 V655 H655 V690" class="line"/>
  <path d="M910 612 V655 H900 V690" class="line"/>
  <path d="M775 612 V650 H655 V690" class="dashed"/>
  <path d="M775 612 V650 H900 V690" class="dashed"/>
  <path d="M765 731 H1035" class="line"/>
  <path d="M1010 731 H1035" class="line"/>

  <!-- Storage and observability -->
  <text x="325" y="872" class="paneltitle">3 · State, memory, and observability</text>
  <rect x="325" y="892" width="300" height="156" rx="11" class="store"/>
  <text x="475" y="926" class="center">Message store</text>
  <text x="475" y="951" class="center-small">zaroori_baat_slack.sqlite3</text>
  <text x="350" y="980" class="small">messages: context_json · actions_json</text>
  <text x="350" y="999" class="small">decision_memory_json · reviewer decision</text>
  <text x="350" y="1018" class="small">decision + decided_at preserved on retries</text>

  <rect x="655" y="892" width="300" height="156" rx="11" class="store"/>
  <text x="805" y="926" class="center">LangGraph checkpointer</text>
  <text x="805" y="951" class="center-small">SQLite locally · PostgreSQL in production</text>
  <text x="680" y="980" class="small">checkpoint path is configurable</text>
  <text x="680" y="999" class="small">LANGGRAPH_CHECKPOINTER=sqlite|postgres</text>
  <text x="680" y="1018" class="small">safe status at /api/workflow/status</text>

  <rect x="985" y="892" width="295" height="156" rx="11" class="store"/>
  <text x="1132" y="926" class="center">Workflow runs</text>
  <text x="1132" y="951" class="center-small">local observability metrics</text>
  <text x="1010" y="980" class="small">running / completed / failed</text>
  <text x="1010" y="999" class="small">duration · agents · classifications</text>
  <text x="1010" y="1018" class="small">GET /api/observability/summary</text>
  <path d="M1145 772 V850 H475 V892" class="line"/>
  <path d="M1145 772 V850 H805 V892" class="dashed"/>
  <path d="M1160 772 V850 H1132 V892" class="dashed"/>

  <!-- Right: consumer and optional integrations -->
  <rect x="1327" y="125" width="245" height="405" rx="12" class="box" filter="url(#shadow)"/>
  <text x="1352" y="162" class="paneltitle">Human review</text>
  <rect x="1349" y="185" width="201" height="112" rx="10" class="human"/>
  <text x="1449" y="216" class="center">Browser dashboard</text>
  <text x="1449" y="241" class="center-small">index.html + app.js</text>
  <text x="1449" y="260" class="center-small">ranked queue + tabs</text>
  <text x="1449" y="279" class="center-small">context / actions / memory</text>
  <rect x="1349" y="315" width="201" height="88" rx="10" class="human"/>
  <text x="1449" y="344" class="center">Explicit decision</text>
  <text x="1449" y="367" class="center-small">approved · deferred</text>
  <text x="1449" y="386" class="center-small">dismissed · escalated</text>
  <rect x="1349" y="421" width="201" height="82" rx="10" class="human"/>
  <text x="1449" y="450" class="center">No auto-send</text>
  <text x="1449" y="473" class="center-small">decision is stored locally</text>
  <text x="1449" y="492" class="center-small">before any future response adapter</text>
  <path d="M1310 280 H1349" class="dashed"/>
  <path d="M1310 650 H1325 V359 H1349" class="dashed"/>

  <rect x="1327" y="555" width="245" height="585" rx="12" class="box" filter="url(#shadow)"/>
  <text x="1352" y="592" class="paneltitle">Optional integrations</text>
  <rect x="1349" y="615" width="201" height="130" rx="10" class="integration"/>
  <text x="1449" y="646" class="center">Nebius Token Factory</text>
  <text x="1449" y="671" class="center-small">Context LLM</text>
  <text x="1449" y="690" class="center-small">Action extraction LLM</text>
  <text x="1449" y="709" class="center-small">Decision memory LLM</text>
  <text x="1449" y="728" class="center-small">deterministic fallback if off</text>
  <rect x="1349" y="765" width="201" height="130" rx="10" class="integration"/>
  <text x="1449" y="796" class="center">Mem0 Platform</text>
  <text x="1449" y="821" class="center-small">semantic decision add/search</text>
  <text x="1449" y="840" class="center-small">optional hosted memory</text>
  <text x="1449" y="859" class="center-small">SQLite fallback when disabled</text>
  <text x="1449" y="878" class="center-small">Sync saved decisions</text>
  <rect x="1349" y="915" width="201" height="188" rx="10" class="integration"/>
  <text x="1449" y="946" class="center">LangSmith</text>
  <text x="1449" y="971" class="center-small">optional tracing</text>
  <text x="1449" y="990" class="center-small">graph + workflow nodes</text>
  <text x="1449" y="1009" class="center-small">Nebius + Mem0 HTTP calls</text>
  <text x="1449" y="1037" class="center-small">content capture off by default</text>
  <text x="1449" y="1061" class="center-small">/api/observability/status</text>
  <text x="1449" y="1080" class="center-small">Open LangSmith</text>
  <path d="M1020 571 H1288 V680 H1349" class="dashed"/>
  <path d="M1255 731 H1288 V830 H1349" class="dashed"/>
  <path d="M1280 970 H1310 V1009 H1349" class="dashed"/>

  <!-- Legend -->
  <rect x="28" y="910" width="245" height="230" rx="12" class="box" filter="url(#shadow)"/>
  <text x="53" y="947" class="paneltitle">Diagram key</text>
  <rect x="53" y="972" width="26" height="18" rx="4" class="agent"/>
  <text x="91" y="986" class="small">Workflow / agent node</text>
  <rect x="53" y="1008" width="26" height="18" rx="4" class="store"/>
  <text x="91" y="1022" class="small">Persistent state</text>
  <rect x="53" y="1044" width="26" height="18" rx="4" class="human"/>
  <text x="91" y="1058" class="small">Human-controlled surface</text>
  <rect x="53" y="1080" width="26" height="18" rx="4" class="integration"/>
  <text x="91" y="1094" class="small">Optional integration</text>
  <path d="M53 1118 H80" class="line"/>
  <text x="91" y="1122" class="small">Runtime data flow</text>

  <!-- Technology footer -->
  <rect x="28" y="1170" width="1544" height="120" rx="14" fill="#fff" stroke="#b7c8be" stroke-width="2"/>
  <text x="800" y="1202" class="paneltitle" text-anchor="middle">Technology and deployment choices</text>
  <g class="small" text-anchor="middle">
    <rect x="55" y="1220" width="155" height="45" rx="8" class="box"/><text x="132" y="1247">Python</text>
    <rect x="225" y="1220" width="190" height="45" rx="8" class="box"/><text x="320" y="1247">Custom HTTP server</text>
    <rect x="430" y="1220" width="155" height="45" rx="8" class="box"/><text x="507" y="1247">LangGraph</text>
    <rect x="600" y="1220" width="155" height="45" rx="8" class="box"/><text x="677" y="1247">SQLite</text>
    <rect x="770" y="1220" width="190" height="45" rx="8" class="box"/><text x="865" y="1247">PostgreSQL option</text>
    <rect x="975" y="1220" width="155" height="45" rx="8" class="box"/><text x="1052" y="1247">Nebius</text>
    <rect x="1145" y="1220" width="155" height="45" rx="8" class="box"/><text x="1222" y="1247">Mem0</text>
    <rect x="1315" y="1220" width="155" height="45" rx="8" class="box"/><text x="1392" y="1247">LangSmith</text>
  </g>
</svg>
