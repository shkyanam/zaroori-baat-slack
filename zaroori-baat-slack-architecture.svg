<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Zaroori Baat — How one Slack message runs</title>
  <desc id="diagram-description">A hand-drawn four-stage architecture diagram. Slack Events API, history sync, and local demo input enter a protected Python service. A fast queue and LangGraph workflow classify and enrich messages. The results are stored for human review in the Inbox and traced in LangSmith, with deterministic safety routing and optional Nebius and Mem0 integrations.</desc>
  <defs>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="17" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="gray"/><feComponentTransfer in="gray"><feFuncA type="table" tableValues="0 .045"/></feComponentTransfer><feBlend in="SourceGraphic" in2="gray" mode="multiply"/></filter>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#2a1c3b" flood-opacity=".18"/></filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="5" orient="auto"><path d="M0 0 L11 5 L0 10 Z" fill="#54248b"/></marker>
    <marker id="soft-arrow" markerWidth="13" markerHeight="13" refX="10" refY="5" orient="auto"><path d="M0 0 L11 5 L0 10 Z" fill="#347a68"/></marker>
    <style>
      .ink{stroke:#28213a;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none}.sketch{stroke:#54248b;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;fill:#fffdf8}.inner{stroke:#4d6b92;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:#fbfdff}.orange{stroke:#df7b3f;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:#fff7ef}.green{stroke:#347a68;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:#f3fff8}.violet{stroke:#7750ae;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:#fbf8ff}.red{stroke:#c94e58;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:#fff5f5}.dash{stroke:#347a68;stroke-width:2;stroke-dasharray:7 6;stroke-linecap:round;fill:#fbfff9}.flow{stroke:#54248b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none;marker-end:url(#arrow)}.optional{stroke:#347a68;stroke-width:2.4;stroke-dasharray:7 6;stroke-linecap:round;fill:none;marker-end:url(#soft-arrow)}
      .title{font:700 43px 'Comic Sans MS','Marker Felt',cursive;fill:#1c2353}.subtitle{font:500 16px 'Comic Sans MS','Marker Felt',cursive;fill:#313044}.panel{font:700 24px 'Comic Sans MS','Marker Felt',cursive;fill:#54248b}.note{font:500 14px 'Comic Sans MS','Marker Felt',cursive;fill:#343142}.small{font:500 12px 'Comic Sans MS','Marker Felt',cursive;fill:#343142}.tiny{font:500 10.5px 'Comic Sans MS','Marker Felt',cursive;fill:#343142}.item{font:700 13px 'Comic Sans MS','Marker Felt',cursive;fill:#1c2353}.label{font:700 12px 'Comic Sans MS','Marker Felt',cursive;fill:#54248b}.white{font:700 17px 'Comic Sans MS','Marker Felt',cursive;fill:#fff}.footer{font:700 14px 'Comic Sans MS','Marker Felt',cursive;fill:#1c2353}
    </style>
  </defs>
  <rect width="1800" height="1120" fill="#fffdf8" filter="url(#paper)"/>
  <g opacity=".33" stroke="#6980a5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 105 L80 32 L140 100 L220 12 L318 108 L392 48 L458 105 L540 30 L620 108 L720 46 L810 105 L900 18 L1015 108 L1120 42 L1210 105 L1315 10 L1420 107 L1510 46 L1600 105 L1700 24 L1788 105" stroke-width="2.2"/><path d="M0 116 Q85 89 163 114 T332 111 T510 116 T690 109 T870 116 T1040 112 T1215 116 T1390 111 T1570 116 T1800 109" stroke-width="1.5"/><path d="M210 31 l16 22 l18 -30 M535 31 l14 19 l20 -18 M898 20 l17 27 l19 -22 M1315 11 l17 25 l18 -20 M1698 27 l15 24 l17 -21" stroke-width="1.2"/></g>
  <text x="900" y="55" text-anchor="middle" class="title">Zaroori Baat — How One Slack Message Actually Runs</text><path d="M280 68 H1520" stroke="#1c2353" stroke-width="3" stroke-linecap="round"/><text x="900" y="94" text-anchor="middle" class="subtitle">a Slack intelligence workspace — fast deterministic triage, optional AI enrichment, always human-controlled</text>

  <g filter="url(#shadow)"><rect x="32" y="138" width="360" height="665" rx="18" class="sketch"/></g><rect x="51" y="157" width="34" height="34" rx="9" fill="#6f38a1"/><text x="68" y="181" text-anchor="middle" class="white">1</text><text x="102" y="182" class="panel">SLACK SIGNALS</text><text x="102" y="205" class="note">three inputs, one consistent event shape</text>
  <rect x="55" y="226" width="314" height="96" rx="11" class="inner"/><g transform="translate(72 245)" class="ink"><rect x="0" y="9" width="38" height="38" rx="8" fill="#fff"/><path d="M10 21 h18 M10 29 h12 M10 37 h16 M18 47 l-5 7 M28 47 l5 7"/></g><text x="124" y="253" class="item">1. Slack Events API</text><text x="124" y="275" class="small">new monitored-channel messages</text><text x="124" y="295" class="small">/webhooks/slack · signed request</text>
  <rect x="55" y="336" width="314" height="96" rx="11" class="inner"/><g transform="translate(72 354)" class="ink"><circle cx="19" cy="22" r="18"/><path d="M19 9 v14 l10 6 M4 43 h30"/></g><text x="124" y="363" class="item">2. Sync Slack history</text><text x="124" y="385" class="small">conversations.history · bounded</text><text x="124" y="405" class="small">incremental · latest 20/channel</text>
  <rect x="55" y="446" width="314" height="96" rx="11" class="inner"/><g transform="translate(72 464)" class="ink"><path d="M3 14 h32 v27 H3 z M11 8 h16 M11 48 h16 M11 25 h16 M19 17 v16"/></g><text x="124" y="473" class="item">3. Local demo / API</text><text x="124" y="495" class="small">POST /api/messages</text><text x="124" y="515" class="small">safe testing without Slack</text>
  <rect x="55" y="560" width="314" height="145" rx="11" class="orange"/><text x="72" y="586" class="label">INGRESS GUARDRAILS</text><text x="72" y="612" class="small">✓ Slack signature and URL-challenge checks</text><text x="72" y="635" class="small">✓ configured channels and subtype filtering</text><text x="72" y="658" class="small">✓ event ID deduplication / idempotency</text><text x="72" y="681" class="small">✓ secrets stay in .env — never in UI</text><text x="72" y="732" class="label" fill="#df7b3f">LIVE MESSAGE → IMMEDIATE QUEUED INBOX ROW</text><text x="72" y="752" class="tiny">the webhook responds promptly; processing continues in background</text>
  <rect x="55" y="720" width="314" height="61" rx="10" class="dash"/><text x="72" y="744" class="label" fill="#347a68">TEST INPUTS</text><text x="72" y="764" class="tiny">golden cases · duplicate event · timeout · prompt injection</text>

  <g filter="url(#shadow)"><rect x="420" y="138" width="390" height="665" rx="18" class="sketch"/></g><rect x="439" y="157" width="34" height="34" rx="9" fill="#6f38a1"/><text x="456" y="181" text-anchor="middle" class="white">2</text><text x="490" y="182" class="panel">ORCHESTRATOR</text><text x="490" y="205" class="note">the durable workflow lives here</text>
  <rect x="444" y="226" width="342" height="83" rx="11" class="violet"/><text x="463" y="252" class="item">Python HTTP service + background queue</text><text x="463" y="274" class="small">fast path: SLACK_FAST_PATH=true</text><text x="463" y="293" class="small">two workers; no blocked Slack response</text>
  <rect x="444" y="324" width="342" height="110" rx="11" class="violet"/><text x="463" y="351" class="item">LangGraph state machine</text><text x="463" y="373" class="small">classify → retrieve → enrich</text><text x="463" y="394" class="small">actions ∥ decisions → persist → router</text><text x="463" y="415" class="tiny">run ID, message ID, trace metadata, durable checkpoints</text>
  <rect x="444" y="449" width="342" height="112" rx="11" class="inner"/><text x="463" y="476" class="item">Deterministic core (always available)</text><text x="463" y="498" class="small">priority · classification · owner · deadline</text><text x="463" y="519" class="small">mocked context · fallback tasks · safety route</text><text x="463" y="540" class="tiny">continues safely if external services are unavailable</text>
  <rect x="444" y="576" width="342" height="92" rx="11" class="orange"/><text x="463" y="602" class="item">Optional full enrichment</text><text x="463" y="624" class="small">Nebius context/action/decision synthesis</text><text x="463" y="644" class="small">requested only by Refresh analysis</text>
  <rect x="444" y="684" width="342" height="97" rx="11" class="dash"/><text x="463" y="710" class="label" fill="#347a68">SHARED WORKFLOW STATE</text><text x="463" y="732" class="small">message, signal, context, actions, decisions, router</text><text x="463" y="753" class="tiny">LangGraph SQLite checkpointer; PostgreSQL is optional</text>

  <g filter="url(#shadow)"><rect x="838" y="138" width="400" height="665" rx="18" class="sketch"/></g><rect x="857" y="157" width="34" height="34" rx="9" fill="#6f38a1"/><text x="874" y="181" text-anchor="middle" class="white">3</text><text x="908" y="182" class="panel">JUDGEMENT</text><text x="908" y="205" class="note">deterministic rules first; AI cannot override safety</text>
  <rect x="862" y="226" width="352" height="116" rx="11" class="inner"/><g transform="translate(882 245)" class="ink"><path d="M20 0 v52 M3 10 h34 M8 10 l-7 20 h14 z M32 10 l-7 20 h14 z M11 52 h18"/></g><text x="940" y="252" class="item">1. Signal detection</text><text x="940" y="274" class="small">FYI · Action Required · Question · Incident</text><text x="940" y="294" class="small">Escalation · Approval Request · Decision Needed</text><text x="940" y="316" class="small">priority: High / Medium / Low</text>
  <rect x="862" y="357" width="352" height="91" rx="11" class="inner"/><text x="882" y="383" class="item">2. Hybrid retrieval + context</text><text x="882" y="405" class="small">keyword/thread matching + local SQLite vector RAG</text><text x="882" y="425" class="small">mocked ADO, build, incident, PR, discussion facts</text>
  <rect x="862" y="463" width="352" height="91" rx="11" class="inner"/><text x="882" y="489" class="item">3. Action + decision extraction</text><text x="882" y="511" class="small">normalized task, owner, deadline, source IDs</text><text x="882" y="531" class="small">decision, alternatives, participants, rationale</text>
  <rect x="862" y="569" width="352" height="110" rx="11" class="green"/><text x="882" y="595" class="item" fill="#347a68">4. Router — safety invariants</text><text x="882" y="617" class="small">human review: Incident, Escalation, Approval,</text><text x="882" y="637" class="small">Decision Needed, or High priority</text><text x="882" y="659" class="small">autonomous action = NONE · fail closed</text>
  <rect x="862" y="696" width="352" height="85" rx="11" class="dash"/><text x="882" y="722" class="label" fill="#347a68">NO UNTRUSTED TEXT CHANGES THE ROUTE</text><text x="882" y="744" class="tiny">prompt injection cannot approve, reply, or bypass human review</text><text x="882" y="763" class="tiny">timeout case retains deterministic incident handling</text>

  <g filter="url(#shadow)"><rect x="1266" y="138" width="365" height="665" rx="18" class="sketch"/></g><rect x="1285" y="157" width="34" height="34" rx="9" fill="#6f38a1"/><text x="1302" y="181" text-anchor="middle" class="white">4</text><text x="1336" y="182" class="panel">OUTCOME</text><text x="1336" y="205" class="note">review, decide, trace — never auto-send</text>
  <rect x="1290" y="226" width="317" height="105" rx="11" class="green"/><text x="1310" y="252" class="item" fill="#347a68">Inbox + Message Detail</text><text x="1310" y="274" class="small">message appears in seconds</text><text x="1310" y="294" class="small">classification, priority, briefing, response</text><text x="1310" y="314" class="small">Refresh analysis for optional full enrichment</text>
  <rect x="1290" y="346" width="317" height="92" rx="11" class="inner"/><text x="1310" y="372" class="item">Human review workspace</text><text x="1310" y="394" class="small">Action items · Decision memory · Reviewed</text><text x="1310" y="415" class="small">people decide; application records evidence</text>
  <rect x="1290" y="453" width="317" height="96" rx="11" class="violet"/><text x="1310" y="479" class="item">SQLite persistence + RAG index</text><text x="1310" y="501" class="small">messages · workflow_runs · local embeddings</text><text x="1310" y="522" class="small">cosine search · no external vector database</text>
  <rect x="1290" y="564" width="317" height="101" rx="11" class="orange"/><text x="1310" y="590" class="item">Optional integrations</text><text x="1310" y="612" class="small">Mem0 stores approved decision memory</text><text x="1310" y="632" class="small">LangSmith traces graph + agent evidence</text><text x="1310" y="652" class="tiny">content capture is off by default</text>
  <rect x="1290" y="680" width="317" height="101" rx="11" class="red"/><text x="1310" y="706" class="item" fill="#c94e58">Clear boundary</text><text x="1310" y="728" class="small">no Slack UI scraping · no automatic reply</text><text x="1310" y="748" class="small">no autonomous approval or external action</text><text x="1310" y="768" class="tiny">safety routing remains deterministic</text>

  <path d="M392 462 H420" class="flow"/><path d="M810 462 H838" class="flow"/><path d="M1238 462 H1266" class="flow"/><text x="405" y="443" text-anchor="middle" class="tiny">event</text><text x="824" y="443" text-anchor="middle" class="tiny">state</text><text x="1252" y="443" text-anchor="middle" class="tiny">result</text>
  <path d="M1650 165 q65 -37 110 4 q18 42 -16 74 q-37 29 -89 5 l-28 18 l10 -29 q-25 -38 13 -72 z" fill="#fffdf8" stroke="#28213a" stroke-width="2.4"/><text x="1702" y="190" text-anchor="middle" class="small">Fast first.</text><text x="1702" y="210" text-anchor="middle" class="small">Classify locally,</text><text x="1702" y="230" text-anchor="middle" class="small">then enrich safely.</text>
  <g transform="translate(1660 295)" class="ink"><path d="M54 3 q10 -17 20 0"/><rect x="18" y="18" width="86" height="72" rx="25" fill="#e9e3fa"/><rect x="30" y="32" width="62" height="35" rx="16" fill="#26355b"/><circle cx="49" cy="49" r="5" fill="#fff"/><circle cx="73" cy="49" r="5" fill="#fff"/><path d="M57 61 q5 4 10 0" stroke="#fff"/><path d="M28 88 L11 124 M93 88 l17 36 M38 115 h46 M18 37 l-18 20 M104 37 l18 20"/></g><text x="1710" y="445" text-anchor="middle" class="label">ZAROORI BOT</text>

  <rect x="32" y="835" width="1599" height="132" rx="15" fill="#fffdf8" stroke="#315c8b" stroke-width="3"/><path d="M293 850 V952 M577 850 V952 M867 850 V952 M1162 850 V952 M1440 850 V952" stroke="#315c8b" stroke-width="1.7"/>
  <g class="footer"><text x="58" y="873">Golden dataset</text><text x="58" y="898" class="small">50 labelled cases</text><text x="58" y="920" class="small">SMI-GD-001 → 050</text><text x="320" y="873">Guarded smoke test</text><text x="320" y="898" class="small">008 context · 027 routing</text><text x="320" y="920" class="small">044 prompt injection</text><text x="604" y="873">Case-aware evaluators</text><text x="604" y="898" class="small">signal · context · actions</text><text x="604" y="920" class="small">decision · safety · latency</text><text x="894" y="873">Trace evidence</text><text x="894" y="898" class="small">root + each agent child run</text><text x="894" y="920" class="small">case ID · versions · latency</text><text x="1188" y="873">Local verification</text><text x="1188" y="898" class="small">21 backend tests</text><text x="1188" y="920" class="small">frontend build passes</text><text x="1466" y="873" fill="#c94e58">Safety promise</text><text x="1466" y="898" class="small">human review before action</text><text x="1466" y="920" class="small">autonomous action: NONE</text></g>
  <rect x="32" y="988" width="1599" height="91" rx="13" fill="#fffdf8" stroke="#b8b1ce" stroke-width="2"/><rect x="58" y="1012" width="34" height="22" rx="4" class="sketch"/><text x="104" y="1028" class="small">System stage</text><rect x="246" y="1012" width="34" height="22" rx="4" class="inner"/><text x="292" y="1028" class="small">Component / module</text><rect x="478" y="1012" width="34" height="22" rx="4" class="orange"/><text x="524" y="1028" class="small">Optional integration</text><rect x="745" y="1012" width="34" height="22" rx="4" class="green"/><text x="791" y="1028" class="small">Safe / human-controlled outcome</text><text x="58" y="1061" class="small">Note: Zaroori Baat is decision support for Slack conversations. It prioritizes and records context; it does not send messages, approve changes, or act autonomously.</text>
</svg>
