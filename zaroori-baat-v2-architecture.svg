<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#173f53"/><stop offset="1" stop-color="#176b62"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f7f3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#183c3b" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3d7180"/></marker>
    <style>
      .title{font:700 48px Georgia,serif;fill:#173f53}.subtitle{font:400 22px Arial,sans-serif;fill:#55716f}.section{font:700 23px Arial,sans-serif;fill:#fff}.paneltitle{font:700 21px Arial,sans-serif;fill:#173f53}.body{font:400 17px Arial,sans-serif;fill:#284744}.small{font:400 15px Arial,sans-serif;fill:#55716f}.bold{font:700 17px Arial,sans-serif;fill:#173f53}.center{font:700 19px Arial,sans-serif;fill:#173f53;text-anchor:middle}.number{font:700 16px Arial,sans-serif;fill:#fff}.box{stroke:#b7d2c8;stroke-width:2;fill:url(#paper)}.source{stroke:#83b5c0;stroke-width:2;fill:#eff8fa}.agent{stroke:#9b8cce;stroke-width:2;fill:#f6f3ff}.store{stroke:#8bb99a;stroke-width:2;fill:#eff9f1}.human{stroke:#e59563;stroke-width:2;fill:#fff5ed}.line{stroke:#3d7180;stroke-width:3;fill:none;marker-end:url(#arrow)}.dashed{stroke:#8aa9a3;stroke-width:2;fill:none;stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1600" height="1030" fill="#fff"/>
  <text x="800" y="58" class="title" text-anchor="middle">Zaroori Baat V2</text>
  <text x="800" y="91" class="subtitle" text-anchor="middle">Slack Signal Desk: from message volume to clear action</text>

  <rect x="28" y="125" width="270" height="205" rx="12" class="box" filter="url(#shadow)"/>
  <text x="55" y="165" class="paneltitle">What It Does</text>
  <text x="55" y="207" class="body">● Scans Slack messages</text><text x="55" y="243" class="body">● Scores actionability</text><text x="55" y="279" class="body">● Ranks urgent signals</text><text x="55" y="315" class="body">● Keeps humans in control</text>

  <rect x="28" y="350" width="270" height="205" rx="12" class="box" filter="url(#shadow)"/>
  <text x="55" y="390" class="paneltitle">Priority Model</text>
  <text x="55" y="432" class="body">▲ High: blocker or deadline</text><text x="55" y="468" class="body">● Medium: action requested</text><text x="55" y="504" class="body">○ Low: informational noise</text><text x="55" y="540" class="body">? Needs human context</text>

  <rect x="28" y="575" width="270" height="205" rx="12" class="box" filter="url(#shadow)"/>
  <text x="55" y="615" class="paneltitle">Human Controls</text>
  <text x="55" y="657" class="body">● Take action</text><text x="55" y="693" class="body">● Defer for later</text><text x="55" y="729" class="body">● Dismiss as noise</text><text x="55" y="765" class="body">● Escalate to an owner</text>

  <rect x="320" y="125" width="900" height="655" rx="15" fill="#fff" stroke="#274c59" stroke-width="3" filter="url(#shadow)"/>
  <path d="M320 125 H820 Q840 125 840 145 V165 H320 Z" fill="url(#navy)"/>
  <text x="350" y="153" class="section">V2 Agentic Architecture</text>

  <rect x="350" y="205" width="205" height="150" rx="12" class="source"/><text x="452" y="245" class="center">Slack Workspace</text><text x="452" y="280" class="small" text-anchor="middle">#all-capacity</text><text x="452" y="306" class="small" text-anchor="middle">Public / private channels</text><text x="452" y="332" class="small" text-anchor="middle">Direct mentions</text>
  <rect x="600" y="205" width="205" height="150" rx="12" class="source"/><text x="702" y="245" class="center">Ingestion Paths</text><text x="702" y="280" class="small" text-anchor="middle">Events API</text><text x="702" y="306" class="small" text-anchor="middle">Sync Slack history</text><text x="702" y="332" class="small" text-anchor="middle">Mock test input</text>
  <path d="M555 280 H600" class="line"/>

  <rect x="850" y="190" width="330" height="75" rx="10" class="agent"/><circle cx="880" cy="228" r="17" fill="#7563bd"/><text x="880" y="234" class="number" text-anchor="middle">1</text><text x="910" y="223" class="bold">Validate and Normalize</text><text x="910" y="247" class="small">Verify signature, deduplicate, standardize</text>
  <rect x="850" y="280" width="330" height="75" rx="10" class="agent"/><circle cx="880" cy="318" r="17" fill="#7563bd"/><text x="880" y="324" class="number" text-anchor="middle">2</text><text x="910" y="313" class="bold">Priority Scoring</text><text x="910" y="337" class="small">Urgency, action terms, mentions, deadline</text>
  <rect x="850" y="370" width="330" height="75" rx="10" class="agent"/><circle cx="880" cy="408" r="17" fill="#7563bd"/><text x="880" y="414" class="number" text-anchor="middle">3</text><text x="910" y="403" class="bold">Signal Summarizer</text><text x="910" y="427" class="small">Summary, reason, suggested next action</text>
  <path d="M805 250 H830 V228 H850" class="line"/><path d="M830 318 H850" class="line"/><path d="M830 408 H850" class="line"/>

  <rect x="350" y="420" width="220" height="115" rx="12" class="store"/><text x="460" y="458" class="center">Message Store</text><text x="460" y="488" class="small" text-anchor="middle">SQLite persistence</text><text x="460" y="512" class="small" text-anchor="middle">Message IDs and decisions</text>
  <rect x="620" y="420" width="220" height="115" rx="12" class="human"/><text x="730" y="458" class="center">Ranked Action Queue</text><text x="730" y="488" class="small" text-anchor="middle">High → medium → low</text><text x="730" y="512" class="small" text-anchor="middle">Score and rationale</text>
  <path d="M460 355 V420" class="line"/><path d="M730 355 V420" class="line"/><path d="M570 477 H620" class="line"/>

  <rect x="850" y="475" width="330" height="75" rx="10" class="agent"/><circle cx="880" cy="513" r="17" fill="#7563bd"/><text x="880" y="519" class="number" text-anchor="middle">4</text><text x="910" y="508" class="bold">Review Context</text><text x="910" y="532" class="small">Channel, sender, time, duplicate signal</text><path d="M840 477 H850" class="line"/>

  <rect x="350" y="590" width="490" height="125" rx="12" class="human"/><text x="595" y="620" class="bold" text-anchor="middle" fill="#a44b27">EXPLICIT HUMAN DECISION</text><rect x="375" y="645" width="125" height="45" rx="7" fill="#fff" stroke="#e59563"/><text x="437" y="673" class="small" text-anchor="middle">Take action</text><rect x="530" y="645" width="125" height="45" rx="7" fill="#fff" stroke="#e59563"/><text x="592" y="673" class="small" text-anchor="middle">Defer</text><rect x="685" y="645" width="125" height="45" rx="7" fill="#fff" stroke="#e59563"/><text x="747" y="673" class="small" text-anchor="middle">Dismiss / Escalate</text><path d="M730 535 V590" class="line"/>
  <rect x="850" y="590" width="330" height="125" rx="12" class="store"/><text x="1015" y="625" class="center">Decision and Eval Log</text><text x="1015" y="657" class="small" text-anchor="middle">Reviewer outcome</text><text x="1015" y="683" class="small" text-anchor="middle">Traceable score and timestamp</text><text x="1015" y="709" class="small" text-anchor="middle">Eval dataset for tuning</text><path d="M840 650 H850" class="line"/>

  <rect x="1245" y="125" width="327" height="205" rx="12" class="box" filter="url(#shadow)"/><text x="1272" y="165" class="paneltitle">How It Works</text><text x="1275" y="205" class="body">1  Receive or sync Slack</text><text x="1275" y="237" class="body">2  Verify and normalize</text><text x="1275" y="269" class="body">3  Score actionability</text><text x="1275" y="301" class="body">4  Rank and review</text>
  <rect x="1245" y="350" width="327" height="205" rx="12" class="box" filter="url(#shadow)"/><text x="1272" y="390" class="paneltitle">Data and Trust</text><text x="1275" y="430" class="body">▣ Slack signature validation</text><text x="1275" y="466" class="body">▣ Event deduplication</text><text x="1275" y="502" class="body">▣ Human decision required</text><text x="1275" y="538" class="body">▣ Secrets outside source</text>
  <rect x="1245" y="575" width="327" height="205" rx="12" class="box" filter="url(#shadow)"/><text x="1272" y="615" class="paneltitle">Integrations</text><text x="1275" y="655" class="body">◆ Slack Events API</text><text x="1275" y="691" class="body">◆ Slack Web API history</text><text x="1275" y="727" class="body">◆ Local SQLite store</text><text x="1275" y="763" class="body">◆ Browser review dashboard</text>

  <rect x="28" y="820" width="1544" height="150" rx="14" fill="#fff" stroke="#b7c8be" stroke-width="2"/><text x="800" y="855" class="paneltitle" text-anchor="middle">Tech Stack</text><g class="small" text-anchor="middle"><rect x="55" y="875" width="180" height="65" rx="9" class="box"/><text x="145" y="914">Python</text><rect x="255" y="875" width="180" height="65" rx="9" class="box"/><text x="345" y="914">Slack Events API</text><rect x="455" y="875" width="180" height="65" rx="9" class="box"/><text x="545" y="914">Slack Web API</text><rect x="655" y="875" width="180" height="65" rx="9" class="box"/><text x="745" y="914">SQLite</text><rect x="855" y="875" width="180" height="65" rx="9" class="box"/><text x="945" y="914">Priority engine</text><rect x="1055" y="875" width="180" height="65" rx="9" class="box"/><text x="1145" y="914">Human review UI</text><rect x="1255" y="875" width="180" height="65" rx="9" class="box"/><text x="1345" y="914">LocalTunnel</text><rect x="1455" y="875" width="100" height="65" rx="9" class="box"/><text x="1505" y="914">Evals</text></g>
</svg>
